name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build and test JavaScript
        run: |
          npm ci
          npm run build
          npm test
          git diff --exit-code -- src/aviutl_whisper/web/vendor

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/ -m "not e2e" --tb=short

  e2e:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deterministic Japanese test font
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install FFmpeg for media verification
        run: choco install ffmpeg --no-progress -y

      - name: Run E2E tests
        run: uv run pytest tests/e2e/ -m "e2e and not slow" --tb=short

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-verification
          path: test-results/video
